<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall 2 Production Twin</title>
  <style>
    :root {
      --bg: #c7c4c0;
      --floor: #c7c7bd;
      --ground: #b7bca8;
      --steel-dark: #4e5054;
      --steel-mid: #72767b;
      --steel-light: #b2b5b9;
      --line-1: #d2d3c9;
      --line-2: #a4a6a0;
      --accent-green: #3dea71;
      --accent-yellow: #f9e81c;
      --accent-blue: #00b6ff;
      --shadow: rgba(0, 0, 0, 0.26);
      --sienna: #d8c29d;
      --ink: #121515;
      --panel: rgba(18, 21, 21, 0.74);
      --panel-2: rgba(12, 14, 14, 0.92);
      --muted: #dfe3e7;
      --owner: #eae7df;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #b5b7b1;
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.1), rgba(0,0,0,0.12)),
        #bdbdb7;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #b9b8b4 0%, #b3b3ae 100%);
      overflow: hidden;
    }

    .top-owner {
      position: absolute;
      top: 14px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      pointer-events: none;
    }

    .top-owner .brand {
      background: rgba(19, 21, 22, 0.70);
      border: 1px solid rgba(255,255,255,0.18);
      color: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 10px 18px 12px 18px;
      backdrop-filter: blur(4px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      pointer-events: auto;
    }

    .top-owner .owner {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(12, 12, 12, 0.2);
      color: var(--owner);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 8px 18px rgba(0,0,0,0.12);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      pointer-events: auto;
    }

    .scene-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - 110px);
      min-height: 640px;
      padding-top: 58px;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #d4d3cf 0%, #c1bfb8 100%);
    }

    .ground {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.28), rgba(0,0,0,0.06)),
        linear-gradient(90deg, rgba(0,0,0,0.03), rgba(255,255,255,0.08));
    }

    .floor-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.40;
      transform: scale(1.06);
      filter: blur(0.2px);
    }

    .hall {
      position: absolute;
      left: 0;
      right: 0;
      top: 5%;
      bottom: 10%;
      perspective: 1300px;
      transform-style: preserve-3d;
    }

    .iso-board {
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(1440px, 92vw);
      height: min(770px, 74vh);
      transform: translate(-50%, -50%) rotateX(61deg) rotateZ(-28deg) scale(1.08);
      transform-style: preserve-3d;
    }

    .road {
      position: absolute;
      left: 5%;
      top: 12%;
      width: 90%;
      height: 63%;
      background: linear-gradient(180deg, rgba(165,170,164,0.62), rgba(165,170,164,0.88));
      border: 2px solid rgba(26,26,26,0.4);
      box-shadow: inset 0 0 0 3px rgba(0,0,0,0.12);
      border-radius: 4px;
      transform: translateZ(8px);
    }

    .road::before, .road::after {
      content: "";
      position: absolute;
      inset: 18% 0 auto 0;
      height: 10px;
      background: rgba(255,255,255,0.06);
    }

    .road::after {
      inset: auto 0 18% 0;
    }

    .lane {
      position: absolute;
      background: rgba(32,32,32,0.08);
      border: 1px solid rgba(0,0,0,0.28);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .lane.yellow {
      background: rgba(245,232,75,0.92);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.18), 0 0 16px rgba(251,242,67,0.6);
    }

    .lane.green {
      background: rgba(56, 225, 87, 0.9);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.15), 0 0 16px rgba(78,255,117,0.4);
    }

    .line-mark-1 { left: 8%; top: 40%; width: 44%; height: 18px; }
    .line-mark-2 { left: 46%; top: 40%; width: 24%; height: 18px; }
    .line-mark-3 { left: 52%; bottom: 14%; width: 26%; height: 18px; }
    .line-mark-4 { left: 22%; bottom: 17%; width: 44%; height: 18px; }

    .green-1 { left: 8%; top: 27%; width: 18px; height: 19%; }
    .green-2 { left: 52%; top: 44%; width: 18px; height: 22%; }
    .yellow-1 { left: 14%; top: 52%; width: 42%; height: 18px; }
    .yellow-2 { left: 43%; top: 18%; width: 38%; height: 18px; }
    .yellow-3 { left: 46%; bottom: 17%; width: 38%; height: 18px; }

    .line-group {
      position: absolute;
      left: 33%;
      top: 17%;
      width: 24%;
      height: 44%;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-end;
      transform: translateZ(24px);
    }

    .line-unit {
      position: relative;
      width: 7.2%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      filter: drop-shadow(0 14px 6px rgba(0,0,0,0.18));
    }

    .line-body {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #d5d0c8 0%, #a1a4a1 100%);
      border: 2px solid rgba(21,26,28,0.8);
      border-top: 3px solid rgba(0, 0, 0, 0.34);
      border-right: 2px solid rgba(0,0,0,0.55);
      border-bottom: 4px solid rgba(0,0,0,0.2);
      box-shadow: inset -2px 2px 0 rgba(255,255,255,0.2), inset 1px -3px 0 rgba(0,0,0,0.15);
      transform: skewY(-1deg);
    }

    .line-body::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 8%;
      bottom: 16%;
      background: rgba(255,255,255,0.06);
      border-left: 2px solid rgba(0,0,0,0.2);
      border-right: 2px solid rgba(0,0,0,0.2);
    }

    .line-unit:nth-child(odd) .line-body {
      background: linear-gradient(180deg, #c6c3be 0%, #94999b 100%);
    }

    .line-tag {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 0) rotate(-90deg);
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 17px;
      color: rgba(18,21,22,0.9);
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
    }

    .line-tag span {
      display: inline-block;
      transform: translateY(3px);
    }

    .input-zone {
      position: absolute;
      left: 5%;
      top: 22%;
      width: 15%;
      height: 33%;
      transform: translateZ(30px);
    }

    .input-zone .zone-wall,
    .output-zone .zone-wall,
    .rack-zone .zone-wall,
    .box-zone .zone-wall {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.1));
      border: 2px solid rgba(0,0,0,0.5);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    .input-zone .zone-wall {
      background: linear-gradient(180deg, #d0d3cf 0%, #7f8a89 100%);
    }

    .output-zone {
      position: absolute;
      right: 8%;
      top: 22%;
      width: 22%;
      height: 32%;
      transform: translateZ(26px);
    }

    .output-zone .zone-wall {
      background: linear-gradient(180deg, #d9d8d3 0%, #969a9e 100%);
    }

    .zone-label {
      position: absolute;
      display: inline-block;
      font-weight: 800;
      font-size: clamp(12px, 1.15vw, 30px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      color: rgba(18, 20, 20, 0.92);
      text-shadow: 1px 1px 0 rgba(255,255,255,0.25);
    }

    .zone-label.input {
      left: -14%;
      top: 36%;
      transform: rotate(90deg);
    }

    .zone-label.output {
      right: -24%;
      top: 32%;
      transform: rotate(-90deg);
    }

    .zone-label.rack {
      left: 26%;
      top: 14%;
      transform: rotate(-90deg);
    }

    .zone-label.boxes {
      right: -10%;
      bottom: 12%;
      transform: rotate(90deg);
    }

    .rack-zone {
      position: absolute;
      left: 30%;
      top: 34%;
      width: 18%;
      height: 26%;
      transform: translateZ(18px);
    }

    .rack-zone .zone-wall {
      background: linear-gradient(180deg, #d4ceb8 0%, #b7a28a 100%);
      border-color: rgba(36,36,32,0.52);
    }

    .rack-boxes {
      position: absolute;
      inset: 12% 8% 14% 8%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10% 10%;
      z-index: 2;
    }

    .rack-boxes span {
      display: block;
      background: linear-gradient(180deg, #d9c6a1, #c1a97e);
      border: 2px solid rgba(0,0,0,0.32);
      box-shadow: inset -3px 3px 0 rgba(0,0,0,0.08);
    }

    .box-zone {
      position: absolute;
      right: 20%;
      bottom: 8%;
      width: 28%;
      height: 21%;
      transform: translateZ(14px);
    }

    .box-zone .zone-wall {
      background: linear-gradient(180deg, #c4ae8d 0%, #b49f7d 100%);
    }

    .box-stack {
      position: absolute;
      inset: 10% 8% 10% 8%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8% 8%;
      z-index: 2;
    }

    .box-stack span {
      display: block;
      background: linear-gradient(180deg, #d5c3a1 0%, #bd9f72 100%);
      border: 2px solid rgba(0,0,0,0.32);
      box-shadow: inset -3px 3px 0 rgba(0,0,0,0.06);
    }

    .legend-tag {
      position: absolute;
      font-weight: 800;
      font-size: clamp(16px, 1.4vw, 36px);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(11, 13, 13, 0.94);
      text-shadow: 1px 1px 0 rgba(255,255,255,0.18);
    }

    .legend-tag.hall {
      left: 58%;
      top: 28%;
      transform: rotate(-90deg);
    }

    .legend-tag.outputs {
      right: 2%;
      top: 26%;
      transform: rotate(90deg);
    }

    .legend-tag.rack {
      left: 34%;
      top: 56%;
      transform: rotate(-90deg);
    }

    .legend-tag.boxes {
      right: 17%;
      bottom: 13%;
      transform: rotate(90deg);
    }

    .mini-card {
      position: absolute;
      left: 20px;
      bottom: 18px;
      background: rgba(18,20,20,0.58);
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.14);
      z-index: 40;
      backdrop-filter: blur(4px);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mini-card .live {
      font-weight: 700;
      color: #69f27a;
      margin-left: 8px;
    }

    .footer-owner {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 12px;
      z-index: 60;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .footer-owner .owner-chip {
      background: rgba(16, 18, 18, 0.76);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      padding: 10px 22px;
      color: var(--owner);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.17em;
      font-weight: 800;
      box-shadow: 0 10px 18px rgba(0,0,0,0.12);
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }

    @media (max-width: 980px) {
      .top-owner {
        left: 12px;
        right: 12px;
      }

      .top-owner .brand,
      .top-owner .owner {
        padding: 8px 12px;
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .scene-wrap {
        height: calc(100vh - 100px);
      }

      .iso-board {
        transform: translate(-50%, -50%) rotateX(60deg) rotateZ(-28deg) scale(0.95);
      }

      .mini-card {
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-owner">
      <div class="brand">Hall 2 Production Twin</div>
      <div class="owner">Owner: bejaouisf8-spec</div>
    </div>

    <div class="scene-wrap">
      <div class="scene">
        <div class="ground"></div>
        <div class="floor-grid"></div>

        <div class="hall">
          <div class="iso-board">
            <div class="road"></div>

            <div class="lane yellow line-mark-1"></div>
            <div class="lane yellow line-mark-2"></div>
            <div class="lane yellow line-mark-3"></div>
            <div class="lane yellow line-mark-4"></div>

            <div class="lane green green-1"></div>
            <div class="lane green green-2"></div>

            <div class="legend-tag hall">Harness Area Hall 2</div>
            <div class="legend-tag outputs">Outputs</div>
            <div class="legend-tag rack">Rack Raw Materials</div>
            <div class="legend-tag boxes">Boxes</div>

            <div class="input-zone">
              <div class="zone-wall"></div>
              <div class="zone-label input">Inputs</div>
            </div>

            <div class="output-zone">
              <div class="zone-wall"></div>
              <div class="zone-label output">Outputs</div>
            </div>

            <div class="rack-zone">
              <div class="zone-wall"></div>
              <div class="rack-boxes">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="zone-label rack">Rack Raw Materials</div>
            </div>

            <div class="box-zone">
              <div class="zone-wall"></div>
              <div class="box-stack">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <div class="zone-label boxes">Boxes</div>
            </div>

            <div class="line-group" aria-label="Production lines">
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 5</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 6</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 7</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 8</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 9</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 10</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 11</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 12</span></div></div></div>
              <div class="line-unit"><div class="line-body"><div class="line-tag"><span>Line 13</span></div></div></div>
            </div>
          </div>
        </div>

        <div class="mini-card">Status <span class="live">Live</span></div>
      </div>
    </div>

    <div class="footer-owner">
      <div class="owner-chip">Owner: bejaouisf8-spec</div>
    </div>
  </div>
</body>
</html>
