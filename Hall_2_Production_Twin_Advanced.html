<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall 2 Production Twin</title>
  <style>
    :root {
      --bg: #c4c6c1;
      --panel: rgba(18, 18, 18, 0.72);
      --panel-soft: rgba(255,255,255,0.12);
      --steel-1: #aeb4b7;
      --steel-2: #7c8388;
      --steel-3: #d9d8d2;
      --line-cream: #d9d8c9;
      --line-silver: #a6a8a1;
      --yellow: #f4eb1f;
      --green: #35e76e;
      --wood: #d4bc90;
      --wood-dark: #b89a68;
      --dark: #1b1d1e;
      --white: #f5f7f8;
      --owner: #f2f2ee;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--dark);
    }

    body {
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(0,0,0,0.08)),
        #bdbbb7;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #c0c1bc 0%, #bbbab5 100%);
    }

    .top-owner, .bottom-owner {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      padding: 14px 22px;
      pointer-events: none;
    }

    .top-owner {
      top: 0;
    }

    .bottom-owner {
      bottom: 0;
      justify-content: center;
    }

    .brand, .owner-tag {
      pointer-events: auto;
      background: rgba(18, 20, 20, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--white);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 10px 20px rgba(0,0,0,0.18);
    }

    .owner-tag {
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      color: var(--owner);
      padding: 10px 18px;
      letter-spacing: 0.12em;
    }

    .scene {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.05)),
        linear-gradient(90deg, rgba(0,0,0,0.02), rgba(255,255,255,0.04));
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.32;
      transform: scale(1.12);
    }

    .plan {
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(1400px, 92vw);
      height: min(760px, 72vh);
      transform: translate(-50%, -50%) rotateX(58deg) rotateZ(-28deg);
      transform-style: preserve-3d;
      border-radius: 8px;
    }

    .road {
      position: absolute;
      left: 3%;
      top: 12%;
      width: 94%;
      height: 65%;
      background: linear-gradient(180deg, rgba(162,167,162,0.84), rgba(151,155,151,0.92));
      border: 2px solid rgba(20,20,20,0.38);
      box-shadow: inset 0 0 0 4px rgba(0,0,0,0.08);
      border-radius: 6px;
    }

    .lane {
      position: absolute;
      border: 1px solid rgba(0,0,0,0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .lane.yellow {
      background: rgba(242, 232, 30, 0.96);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.12);
    }

    .lane.green {
      background: rgba(43, 226, 90, 0.95);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.12);
    }

    .road-line-1 { left: 8%; top: 38%; width: 46%; height: 18px; }
    .road-line-2 { left: 46%; top: 38%; width: 28%; height: 18px; }
    .road-line-3 { left: 50%; bottom: 18%; width: 32%; height: 18px; }
    .road-line-4 { left: 17%; bottom: 18%; width: 46%; height: 18px; }

    .green-rail-1 { left: 4%; top: 20%; width: 18px; height: 28%; }
    .green-rail-2 { left: 53%; top: 43%; width: 18px; height: 26%; }

    .label {
      position: absolute;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(20,22,22,0.9);
      font-size: clamp(14px, 1.4vw, 32px);
      text-shadow: 1px 1px 0 rgba(255,255,255,0.18);
      white-space: nowrap;
    }

    .label.hall {
      left: 57%;
      top: 27%;
      transform: rotate(-90deg);
    }

    .label.output {
      right: 5%;
      top: 28%;
      transform: rotate(-90deg);
    }

    .label.rack {
      left: 30%;
      top: 43%;
      transform: rotate(-90deg);
    }

    .label.boxes {
      right: 18%;
      bottom: 18%;
      transform: rotate(90deg);
    }

    .input-zone, .output-zone, .rack-zone, .box-zone {
      position: absolute;
      border: 2px solid rgba(0,0,0,0.42);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    .input-zone {
      left: 4%;
      top: 22%;
      width: 16%;
      height: 32%;
      background: linear-gradient(180deg, #d1d2cd 0%, #869091 100%);
    }

    .output-zone {
      right: 7%;
      top: 20%;
      width: 24%;
      height: 32%;
      background: linear-gradient(180deg, #d5d4cf 0%, #9a9ca0 100%);
    }

    .rack-zone {
      left: 27%;
      top: 36%;
      width: 22%;
      height: 28%;
      background: linear-gradient(180deg, #d4c6a6 0%, #ba9e72 100%);
    }

    .box-zone {
      right: 18%;
      bottom: 10%;
      width: 32%;
      height: 20%;
      background: linear-gradient(180deg, #cdb693 0%, #b59263 100%);
    }

    .input-zone .inner-label,
    .output-zone .inner-label,
    .rack-zone .inner-label,
    .box-zone .inner-label {
      position: absolute;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(16,17,18,0.94);
      font-size: clamp(12px, 1.2vw, 28px);
      text-shadow: 1px 1px 0 rgba(255,255,255,0.12);
      white-space: nowrap;
    }

    .input-zone .inner-label {
      left: -12%;
      top: 32%;
      transform: rotate(90deg);
    }

    .output-zone .inner-label {
      right: -24%;
      top: 35%;
      transform: rotate(-90deg);
    }

    .rack-zone .inner-label {
      left: 18%;
      top: 8%;
      transform: rotate(-90deg);
    }

    .box-zone .inner-label {
      right: 0%;
      bottom: 8%;
      transform: rotate(90deg);
    }

    .rack-boxes, .box-stack {
      position: absolute;
      display: grid;
      gap: 10% 8%;
      z-index: 2;
    }

    .rack-boxes {
      inset: 12% 8% 16% 8%;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }

    .box-stack {
      inset: 10% 8% 12% 8%;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }

    .rack-boxes span, .box-stack span {
      display: block;
      background: linear-gradient(180deg, #d9c59d 0%, #c1a57d 100%);
      border: 2px solid rgba(0,0,0,0.35);
      box-shadow: inset -2px 2px 0 rgba(0,0,0,0.08);
    }

    .line-row {
      position: absolute;
      left: 31%;
      top: 14%;
      width: 38%;
      height: 48%;
      display: flex;
      gap: 5px;
      align-items: flex-end;
      justify-content: space-between;
      z-index: 3;
    }

    .line {
      position: relative;
      width: 8%;
      height: 100%;
      background: linear-gradient(180deg, #d8d5d0 0%, #a2a3a1 100%);
      border: 2px solid rgba(18,18,18,0.72);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
      transform: skewY(-1deg);
    }

    .line:nth-child(odd) {
      background: linear-gradient(180deg, #cfcac3 0%, #93999a 100%);
    }

    .line::before {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      top: 8%;
      bottom: 16%;
      border-left: 2px solid rgba(0,0,0,0.18);
      border-right: 2px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.04);
    }

    .line-tag {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 0) rotate(-90deg);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(16,17,17,0.9);
      white-space: nowrap;
    }

    .info-pill {
      position: absolute;
      left: 20px;
      bottom: 18px;
      background: rgba(17,20,20,0.68);
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      z-index: 25;
    }

    .info-pill .live {
      color: #69f47d;
      margin-left: 8px;
    }

    @media (max-width: 920px) {
      .top-owner, .bottom-owner {
        padding-left: 12px;
        padding-right: 12px;
      }

      .brand, .owner-tag {
        font-size: 9px;
        letter-spacing: 0.08em;
        padding: 8px 12px;
      }

      .plan {
        width: 96vw;
        height: 70vh;
        transform: translate(-50%, -50%) rotateX(54deg) rotateZ(-28deg) scale(0.95);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-owner">
      <div class="brand">Hall 2 Production Twin</div>
      <div class="owner-tag">Owner: bejaouisf8-spec</div>
    </div>

    <div class="scene">
      <div class="grid"></div>

      <div class="plan">
        <div class="road"></div>

        <div class="lane yellow road-line-1"></div>
        <div class="lane yellow road-line-2"></div>
        <div class="lane yellow road-line-3"></div>
        <div class="lane yellow road-line-4"></div>

        <div class="lane green green-rail-1"></div>
        <div class="lane green green-rail-2"></div>

        <div class="label hall">Harness Area Hall 2</div>
        <div class="label output">Outputs</div>
        <div class="label rack">Rack Raw Materials</div>
        <div class="label boxes">Boxes</div>

        <div class="input-zone">
          <div class="inner-label">Inputs</div>
        </div>

        <div class="output-zone">
          <div class="inner-label">Outputs</div>
        </div>

        <div class="rack-zone">
          <div class="rack-boxes">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="inner-label">Rack Raw Materials</div>
        </div>

        <div class="box-zone">
          <div class="box-stack">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="inner-label">Boxes</div>
        </div>

        <div class="line-row" aria-label="Production lines">
          <div class="line"><div class="line-tag">Line 5</div></div>
          <div class="line"><div class="line-tag">Line 6</div></div>
          <div class="line"><div class="line-tag">Line 7</div></div>
          <div class="line"><div class="line-tag">Line 8</div></div>
          <div class="line"><div class="line-tag">Line 9</div></div>
          <div class="line"><div class="line-tag">Line 10</div></div>
          <div class="line"><div class="line-tag">Line 11</div></div>
          <div class="line"><div class="line-tag">Line 12</div></div>
          <div class="line"><div class="line-tag">Line 13</div></div>
        </div>
      </div>
    </div>

    <div class="info-pill">Status <span class="live">Live</span></div>

    <div class="bottom-owner">
      <div class="owner-tag">Owner: bejaouisf8-spec</div>
    </div>
  </div>
</body>
</html>
